<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Recipe Image Uploader</title>
    <style>
        #latestImages img {
            width: 150px;
            margin: 5px;
            border: 1px solid #ccc;
            border-radius: 4px;
            cursor: pointer;
            transition: transform 0.2s;
        }
        #latestImages img:hover {
            transform: scale(1.05);
            border-color: #888;
        }
    </style>
</head>
<body>
<h1>Upload image + watermark</h1>
<form id="uploadForm">
    <input type="file" name="image" accept="image/*" required>
    <button type="submit">Upload</button>
</form>
<div id="status"></div>

<h2>Last 10 Uploaded Images</h2>
<div id="latestImages"></div>

<script>
    const form = document.getElementById('uploadForm');
    const statusDiv = document.getElementById('status');
    const latestImagesDiv = document.getElementById('latestImages');

    form.addEventListener('submit', async (e) => {
        e.preventDefault();

        statusDiv.textContent = 'Uploading...';

        const formData = new FormData(form);

        try {
            const response = await fetch('/api/upload', {
                method: 'POST',
                body: formData
            });

            const result = await response.json();

            if (response.ok) {
                statusDiv.innerHTML = `Success! ID: <b>${result.id}</b>`;
                form.reset();
                // Refresh latest images
                fetchLatestImages();
            } else {
                statusDiv.textContent = `Error: ${result.message || 'Unknown error'}`;
            }
        } catch (error) {
            console.error('Fetch error:', error);
            statusDiv.textContent = 'Network or server Error.';
        }
    });

    // Function to fetch and display last 10 images
    async function fetchLatestImages() {
        try {
            const response = await fetch('/api/images/latest');
            if (!response.ok) throw new Error('Failed to fetch latest images');

            const images = await response.json();
            latestImagesDiv.innerHTML = '';

            images.forEach(img => {
                const imgEl = document.createElement('img');
                imgEl.src = img.url;
                imgEl.title = new Date(img.lastModified).toLocaleString();

                // Open full image on click
                imgEl.addEventListener('click', () => {
                    window.open(img.url, '_blank');
                });

                latestImagesDiv.appendChild(imgEl);
            });
        } catch (error) {
            console.error('Error fetching latest images:', error);
            latestImagesDiv.textContent = 'Failed to load images.';
        }
    }

    // Initial load
    fetchLatestImages();
</script>
</body>
</html>
