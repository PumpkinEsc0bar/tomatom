<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Recipe Image Uploader</title>
</head>
<body>
    <h1>Upload image + watermark </h1>
    <form id="uploadForm">
        <input type="file" name="image" accept="image/*" required>
        <button type="submit">Upload</button>
    </form>
    <div id="status"></div>

    <script>
        const form = document.getElementById('uploadForm');
        const statusDiv = document.getElementById('status');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            statusDiv.textContent = 'Loading...';
            
            const formData = new FormData(form);
            
            try {
                const response = await fetch('/api/upload', {
                    method: 'POST',
                    body: formData
                });

                const result = await response.json();

                if (response.ok) {
                    statusDiv.innerHTML = `Success! ID: <b>${result.id}</b>. MinIO:9001.`;
                } else {
                    statusDiv.textContent = `Error: ${result.message || 'Unknown error'}`;
                }
            } catch (error) {
                console.error('Fetch error:', error);
                statusDiv.textContent = 'Network or server Error.';
            }
        });
    </script>
</body>
</html>
