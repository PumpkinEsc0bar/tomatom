<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Recipe Image Uploader</title>
    <link rel="stylesheet" href="style/styles.css">
</head>
<body>
<div class="container">
    <h1>Upload image + watermark</h1>

    <form id="uploadForm">
        <input type="file" name="image" accept="image/*" required>
        <button type="submit">Upload</button>
    </form>

    <div id="status"></div>

    <h2>Last 10 Uploaded Images</h2>
    <div id="latestImages">Loading images...</div>
</div>

<script>
    const API_BASE_URL = '${REACT_APP_API_URL}';

    const form = document.getElementById('uploadForm');
    const statusDiv = document.getElementById('status');
    const latestImagesDiv = document.getElementById('latestImages');

    form.addEventListener('submit', async (e) => {
        e.preventDefault();

        statusDiv.textContent = 'Uploading...';
        statusDiv.className = '';
        statusDiv.style.display = 'block';

        const formData = new FormData(form);

        try {
            const response = await fetch(`${API_BASE_URL}/api/upload`, {
                method: 'POST',
                body: formData
            });

            const result = await response.json();

            if (response.ok) {
                statusDiv.innerHTML = `Success! ID: <b>${result.id}</b>`;
                statusDiv.className = 'success';
                form.reset();
                fetchLatestImages();
            } else {
                statusDiv.textContent = `Error: ${result.message || 'Unknown error'}`;
                statusDiv.className = 'error';
            }
        } catch (error) {
            console.error('Fetch error:', error);
            statusDiv.textContent = 'Network or server error.';
            statusDiv.className = 'error';
        }
    });

    async function fetchLatestImages() {
        try {
            const response = await fetch(`${API_BASE_URL}/api/images/latest`);
            if (!response.ok) throw new Error('Failed to fetch latest images');

            const images = await response.json();
            latestImagesDiv.innerHTML = '';

            if (images.length === 0) {
                latestImagesDiv.textContent = 'No images uploaded yet.';
                return;
            }

            images.forEach(img => {
                const container = document.createElement('div');
                container.className = 'image-container';

                const imgEl = document.createElement('img');
                imgEl.src = img.url;
                imgEl.alt = img.name;
                imgEl.title = `Click to open - ${new Date(img.lastModified).toLocaleString()}`;
                imgEl.addEventListener('click', () => window.open(img.url, '_blank'));

                const dateEl = document.createElement('div');
                dateEl.className = 'image-date';
                dateEl.textContent = new Date(img.lastModified).toLocaleString();

                container.appendChild(imgEl);
                container.appendChild(dateEl);
                latestImagesDiv.appendChild(container);
            });
        } catch (error) {
            console.error('Error fetching latest images:', error);
            latestImagesDiv.textContent = 'Failed to load images.';
        }
    }

    fetchLatestImages();
</script>
</body>
</html>
