<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Recipe Image Uploader</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }
        #uploadForm {
            margin-bottom: 30px;
        }
        #uploadForm input[type="file"] {
            margin-right: 10px;
        }
        #uploadForm button {
            padding: 8px 16px;
            cursor: pointer;
        }
        #status {
            margin-top: 10px;
            padding: 10px;
            border-radius: 4px;
        }
        #status.success {
            background-color: #d4edda;
            color: #155724;
        }
        #status.error {
            background-color: #f8d7da;
            color: #721c24;
        }
        #latestImages {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }
        #latestImages img {
            width: 150px;
            height: 150px;
            object-fit: cover;
            border: 1px solid #ccc;
            border-radius: 4px;
            cursor: pointer;
            transition: transform 0.2s;
        }
        #latestImages img:hover {
            transform: scale(1.05);
            border-color: #888;
        }
        .image-container {
            position: relative;
        }
        .image-date {
            font-size: 11px;
            color: #666;
            text-align: center;
            margin-top: 5px;
        }
    </style>
</head>
<body>
<h1>Upload image + watermark</h1>
<form id="uploadForm">
    <input type="file" name="image" accept="image/*" required>
    <button type="submit">Upload</button>
</form>
<div id="status"></div>

<h2>Last 10 Uploaded Images</h2>
<div id="latestImages">Loading images...</div>

<script>
    // Подставляем backend через envsubst в Dockerfile
    const API_BASE_URL = '${REACT_APP_API_URL}';

    const form = document.getElementById('uploadForm');
    const statusDiv = document.getElementById('status');
    const latestImagesDiv = document.getElementById('latestImages');

    form.addEventListener('submit', async (e) => {
        e.preventDefault();

        statusDiv.textContent = 'Uploading...';

        const formData = new FormData(form);

        try {
            const response = await fetch(`${API_BASE_URL}/api/upload`, {
                method: 'POST',
                body: formData
            });

            const result = await response.json();

            if (response.ok) {
                statusDiv.innerHTML = `Success! ID: <b>${result.id}</b>`;
                statusDiv.className = 'success';
                form.reset();
                fetchLatestImages();
            } else {
                statusDiv.textContent = `Error: ${result.message || 'Unknown error'}`;
                statusDiv.className = 'error';
            }
        } catch (error) {
            console.error('Fetch error:', error);
            statusDiv.textContent = 'Network or server Error.';
        }
    });

    async function fetchLatestImages() {
        try {
            const response = await fetch(`${API_BASE_URL}/api/images/latest`);
            if (!response.ok) throw new Error('Failed to fetch latest images');

            const images = await response.json();
            latestImagesDiv.innerHTML = '';

            if (images.length === 0) {
                latestImagesDiv.textContent = 'No images uploaded yet.';
                return;
            }

            images.forEach(img => {
                const container = document.createElement('div');
                container.className = 'image-container';

                const imgEl = document.createElement('img');
                imgEl.src = img.url;
                imgEl.alt = img.name;
                imgEl.title = `Click to open - ${new Date(img.lastModified).toLocaleString()}`;
                imgEl.addEventListener('click', () => window.open(img.url, '_blank'));

                const dateEl = document.createElement('div');
                dateEl.className = 'image-date';
                dateEl.textContent = new Date(img.lastModified).toLocaleString();

                container.appendChild(imgEl);
                container.appendChild(dateEl);
                latestImagesDiv.appendChild(container);
            });
        } catch (error) {
            console.error('Error fetching latest images:', error);
            latestImagesDiv.textContent = 'Failed to load images.';
        }
    }

    fetchLatestImages();
</script>
</body>
</html>
