services:
  # Object Storage
  minio:
    image: minio/minio
    container_name: minio
    ports:
      - "9000:9000" # API (Backend)
      - "9001:9001" # browser
    volumes:
      - minio_data:/data
    environment:
      MINIO_ENDPOINT: minio
      MINIO_PORT: 9000
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
      MINIO_SERVER_URL: http://minio:9000
    command: minio server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - recipe-net

  # Kafka KRaft
  kafka:
    image: confluentinc/cp-kafka:7.8.0
    container_name: kafka
    hostname: kafka
    # This port is only used for external connection (e.g., local consumer outside Docker)
    ports:
      - "9092:9092"
    volumes:
      - kafka_data:/var/lib/kafka/data
    environment:
      # KRaft Settings
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      # Listeners
      KAFKA_LISTENERS: PLAINTEXT://kafka:29092,CONTROLLER://kafka:29093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092
      # ВИПРАВЛЕНО: 'CONTROLLER:P$' на 'CONTROLLER:PLAINTEXT'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      # Other Settings
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      CLUSTER_ID: "4V77QGfSTc21X9wYn9m-JQ"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:29092 || exit 1"]
      interval: 5s
      timeout: 10s
      retries: 10
      start_period: 15s
    networks:
      - recipe-net
    depends_on:
      - minio

  kafka-init:
    image: confluentinc/cp-kafka:7.8.0
    container_name: kafka-init
    depends_on:
      kafka:
        condition: service_started
    command:
      - bash
      - -c
      - |
        echo 'Waiting for Kafka to be ready...'
        kafka-topics --bootstrap-server kafka:29092 --list
        
        echo 'Creating topics...'
        kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic image-uploads --replication-factor 1 --partitions 3
        kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic image-processing --replication-factor 1 --partitions 3
        
        echo 'Topics created:'
        kafka-topics --bootstrap-server kafka:29092 --list
    networks:
      - recipe-net

  # Backend (Node.js/Express)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: backend
    environment:
      # MinIO Configuration
      MINIO_ENDPOINT: minio
      MINIO_PORT: 9000
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
      MINIO_USE_SSL: "false"
      # Kafka Configuration (using internal port 29092)
      KAFKA_BROKERS: kafka:29092
      # Змінні оточення для бакетів
      RAW_BUCKET_NAME: recipe-raw-images
      PROCESSED_BUCKET_NAME: recipe-processed-images
    networks:
      - recipe-net
    depends_on:
      minio:
        condition: service_started
      kafka-init:
        condition: service_completed_successfully
      kafka:
        condition: service_started

  # Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: frontend
    ports:
      - "3000:80" # Зовнішній порт 3000
    networks:
      - recipe-net
    depends_on:
      - backend

networks:
  recipe-net:
    driver: bridge

# Volumes to store MinIO and Kafka
volumes:
  minio_data:
  kafka_data:
