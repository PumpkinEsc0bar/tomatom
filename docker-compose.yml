services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: backend
    environment:
      # Azure Blob Storage Configuration
      AZURE_STORAGE_CONNECTION_STRING: ${AZURE_STORAGE_CONNECTION_STRING}

      # Azure Event Hubs Configuration (Kafka API)
      EVENTHUB_NAMESPACE: ${EVENTHUB_NAMESPACE}
      EVENTHUB_CONNECTION_STRING: ${EVENTHUB_CONNECTION_STRING}
      EVENTHUB_NAME_UPLOADS: image-uploads

      # Kafka-compatible settings for Event Hubs
      KAFKA_BROKERS: ${EVENTHUB_NAMESPACE}.servicebus.windows.net:9093
      KAFKA_SASL_USERNAME: $ConnectionString
      KAFKA_SASL_PASSWORD: ${EVENTHUB_CONNECTION_STRING}
      KAFKA_SASL_MECHANISM: PLAIN
      KAFKA_SECURITY_PROTOCOL: SASL_SSL

      RAW_CONTAINER_NAME: recipe-raw-images
      PROCESSED_CONTAINER_NAME: recipe-processed-images

      # Application settings
      NODE_ENV: production
      PORT: 8080
      KAFKA_TOPIC: image-uploads
    ports:
      - "8080:8080"
    networks:
      - recipe-net
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: frontend
    ports:
      - "3000:80"
    environment:
      REACT_APP_API_URL: http://localhost:8080
    networks:
      - recipe-net
    depends_on:
      - backend
    restart: unless-stopped

networks:
  recipe-net:
    driver: bridge